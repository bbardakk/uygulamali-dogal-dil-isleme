project:
  type: book
  output-dir: _book

lang: tr

book:
  title: "Uygulamalı Doğal Dil İşleme"
  subtitle: "Token'lardan Ajanlara — mühendisler ve istatistikçiler için uygulamalı bir kurs"
  author: "Dr. Batuhan Bardak"
  date: today
  date-format: "MMMM YYYY"
  favicon: assets/favicon.svg
  site-url: https://bbardakk.github.io/uygulamali-dogal-dil-isleme/tr
  repo-url: https://github.com/bbardakk/uygulamali-dogal-dil-isleme
  repo-subdir: tr
  repo-actions: [edit, issue]
  search:
    location: sidebar
  page-navigation: true

  sidebar:
    style: docked
    collapse-level: 1
    tools:
      - icon: translate
        href: ../en/index.html
        text: "English edition"

  page-footer:
    left: |
      © 2026 Dr. Batuhan Bardak · Metin [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/), kod MIT.
    right:
      - text: "English"
        href: ../en/index.html

  chapters:
    - index.qmd
    - cite.qmd
    - preface.qmd
    - part: "Kısım I — Temeller"
      chapters:
        - chapters/01-neden-nlp.qmd
        - chapters/02-metin-veri.qmd
        - chapters/03-gommeler.qmd
        - chapters/04-karsilastirma.qmd
        - chapters/05-veri-etiketleme.qmd
    - part: "Kısım II — Yapay Sinir Ağı Tabanlı Dil Modelleri"
      chapters:
        - chapters/06-dil-modelleri.qmd
        - chapters/07-transformerlar.qmd
        - chapters/08-on-egitim.qmd
        - chapters/09-egitim-sonrasi.qmd
        - chapters/10-akil-yuruten-modeller.qmd
    - part: "Kısım III — Temel NLP Görevleri"
      chapters:
        - chapters/11-kumeleme-konu.qmd
        - chapters/12-siniflandirma.qmd
        - chapters/13-dizi-etiketleme.qmd
        - chapters/14-ozetleme.qmd
        - chapters/15-makine-cevirisi.qmd
        - chapters/16-turkce-nlp.qmd
    - part: "Kısım IV — LLM'lerle Çalışmak"
      chapters:
        - chapters/17-promptlama.qmd
        - chapters/18-cozumleme.qmd
        - chapters/19-erisim.qmd
        - chapters/20-erisimle-uretim.qmd
        - chapters/21-cok-modlu.qmd
        - chapters/22-llm-degerlendirme.qmd
    - part: "Kısım V — Ajan Tabanlı Sistemler"
      chapters:
        - chapters/23-ajan-anatomisi.qmd
        - chapters/24-arac-tasarimi.qmd
        - chapters/25-baglam-muhendisligi.qmd
        - chapters/26-bellek.qmd
        - chapters/27-mcp-birlikte-calisabilirlik.qmd
        - chapters/28-cok-ajanli.qmd
        - chapters/29-ajan-rag.qmd
        - chapters/30-ajan-degerlendirme.qmd
    - part: "Kısım VI — Üretimde Ajanlar"
      chapters:
        - chapters/31-servis.qmd
        - chapters/32-gecit.qmd
        - chapters/33-dagitim-guvenilirlik.qmd
        - chapters/34-gozlemlenebilirlik.qmd
        - chapters/35-uretim-degerlendirme.qmd
        - chapters/36-ajan-guvenligi.qmd
        - chapters/37-korkuluklar-gozetim.qmd
        - chapters/38-yonetisim-finops.qmd
    - part: "Kısım VII — Bitirme Projesi"
      chapters:
        - chapters/39-vaka-calismasi.qmd
    - references.qmd

  appendices:
    - appendices/a-kurulum.qmd
    - appendices/b-matematik.qmd
    - appendices/c-sozluk.qmd
    - appendices/d-bitirme-projesi.qmd
    - appendices/e-ders-plani.qmd
    - appendices/f-turkce-kaynaklar.qmd

# Tek kaynak: kaynakça İngilizce sürümle paylaşılır, kopyalanmaz.
bibliography: ../en/references.bib

format:
  html:
    theme:
      light: [cosmo, theme/custom-light.scss]
      dark: [darkly, theme/custom-dark.scss]
    toc: true
    toc-title: "Bu sayfada"
    code-copy: true
    link-external-newwindow: true
    smooth-scroll: true
    grid:
      sidebar-width: 300px
      body-width: 820px
      margin-width: 220px
